source s_suricata {
    file("/var/log/suricata/eve.json" flags(no-parse));
};

destination d_elasticsearch {
    elasticsearch-http(
        index("suricata-logs")
        url("http://127.0.0.1:9200/_bulk")
        template("${MESSAGE}\n")
    );
};

log {
    source(s_suricata);
    destination(d_elasticsearch);
};